#baseURL = "https://jacmoe.github.io/hccw/"
baseURL = "https://jacmoe.github.io/"
languageCode = "en-us"
title = "Hotel California of Creative Writing"
publishDir = "docs"
theme = "hugo-theme-relearn"

[params]
  themeVariant = ['zen-dark', 'zen-light']

# Needed for mermaid shortcodes
[markup]
  [markup.goldmark.renderer]
    # Needed for mermaid shortcode or when nesting shortcodes (e.g. img within
    # columns or tabs)
    unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 9

[taxonomies]
   tag = "tags"
